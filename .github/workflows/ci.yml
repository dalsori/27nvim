name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  config:
    name: Neovim 0.12 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NVIM_INSTALL: '1'
      NVIM_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.4
      - name: Install configuration (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$HOME/.config/nvim"
          cp -r init.lua lua after nvim-pack-lock.json "$HOME/.config/nvim/"
      - name: Install configuration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:LOCALAPPDATA 'nvim'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item init.lua,lua,after,nvim-pack-lock.json -Destination $target -Recurse
      - name: Syntax
        run: nvim --headless -l tests/syntax.lua
      - name: Agent context and buffer safety
        run: nvim --headless -l tests/editor.lua
      - name: Install native plugins and verify startup
        run: nvim --headless -c "lua dofile('tests/health.lua')" -c 'qa!'
